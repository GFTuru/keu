<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>CALC. NOIR — Precision Instrument</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,500;1,9..144,600&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

:root{
  --void: #0c0a11;
  --panel: #16121d;
  --panel-2: #1c1826;
  --gold: #c9a961;
  --gold-bright: #ecd9a3;
  --cream: #f3ead9;
  --cream-dim: #a89f8f;
  --crimson: #c1453c;
  --border: rgba(201,169,97,0.22);
}

*{box-sizing:border-box; margin:0; padding:0;}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(ellipse 80% 60% at 50% 0%, #241d30 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 90% 100%, #23151a 0%, transparent 55%),
    var(--void);
  font-family:'JetBrains Mono', monospace;
  padding:32px 16px;
  overflow:hidden;
}

.stage{
  position:relative;
  width:340px;
}

.eyebrow{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  margin-bottom:14px;
  padding:0 4px;
}
.eyebrow .mark{
  font-size:10.5px;
  letter-spacing:0.28em;
  color:var(--gold);
  text-transform:uppercase;
  font-weight:600;
}
.eyebrow .ref{
  font-size:9.5px;
  letter-spacing:0.15em;
  color:var(--cream-dim);
}

.calc{
  position:relative;
  background: linear-gradient(160deg, var(--panel-2), var(--panel) 60%);
  border-radius:22px;
  padding:22px;
  border:1px solid var(--border);
  box-shadow:
    0 30px 60px -20px rgba(0,0,0,0.7),
    0 0 0 1px rgba(0,0,0,0.4),
    inset 0 1px 0 rgba(255,255,255,0.04);
}

.calc::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:22px;
  padding:1px;
  background: linear-gradient(135deg, rgba(201,169,97,0.5), transparent 30%, transparent 70%, rgba(201,169,97,0.25));
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events:none;
}

/* screen */
.screen{
  position:relative;
  background: linear-gradient(180deg, #0a0810, #100c17);
  border-radius:14px;
  padding:22px 20px 18px;
  margin-bottom:18px;
  min-height:118px;
  border:1px solid rgba(0,0,0,0.6);
  box-shadow: inset 0 2px 10px rgba(0,0,0,0.6), inset 0 0 40px rgba(201,169,97,0.03);
  overflow:hidden;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
}

.screen .expr{
  font-size:13px;
  color:var(--cream-dim);
  letter-spacing:0.03em;
  min-height:16px;
  text-align:right;
  opacity:0.75;
  transition: opacity 0.2s ease;
}

.screen .result{
  font-size:38px;
  font-weight:600;
  color:var(--cream);
  text-align:right;
  letter-spacing:0.01em;
  line-height:1.15;
  margin-top:4px;
  word-break:break-all;
  transition: transform 0.15s ease;
}

/* reveal layer for the prank */


/* keypad */
.pad{
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  gap:10px;
}

button{
  font-family:'JetBrains Mono', monospace;
  font-size:16px;
  font-weight:500;
  border:none;
  border-radius:12px;
  height:56px;
  cursor:pointer;
  color:var(--cream);
  background: linear-gradient(160deg, #241f30, #1a1624);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.06),
    inset 0 -2px 4px rgba(0,0,0,0.4),
    0 1px 0 rgba(0,0,0,0.3);
  transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.15s ease;
  -webkit-tap-highlight-color: transparent;
}
button:active{
  transform: translateY(1px) scale(0.97);
  box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
}

button.fn{
  color:var(--gold);
  background: linear-gradient(160deg, #2a2418, #1e1a12);
}
button.op{
  color:var(--gold-bright);
  background: linear-gradient(160deg, #2c2416, #1f190e);
  font-size:18px;
}
button.zero{ grid-column: span 2; }

button.eq{
  background: linear-gradient(160deg, var(--crimson), #8f2f28);
  color:var(--cream);
  font-weight:700;
  letter-spacing:0.04em;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.15),
    0 8px 20px -6px rgba(193,69,60,0.55);
}
button.eq:active{
  box-shadow: inset 0 2px 6px rgba(0,0,0,0.4);
}

.footer-note{
  text-align:center;
  margin-top:14px;
  font-size:9px;
  letter-spacing:0.14em;
  color:var(--cream-dim);
  opacity:0.5;
  text-transform:uppercase;
}
</style>
</head>
<body>

<div class="stage">
  <div class="eyebrow">
    <span class="mark">Calc. Noir</span>
    <span class="ref">No. 0001 / Édition Or</span>
  </div>

  <div class="calc">
    <div class="screen" id="screen">
      <div class="expr" id="expr">&nbsp;</div>
      <div class="result" id="result">0</div>
    </div>

    <div class="pad">
      <button class="fn" data-action="clear">C</button>
      <button class="fn" data-action="sign">±</button>
      <button class="fn" data-action="percent">%</button>
      <button class="op" data-val="÷">÷</button>

      <button data-val="7">7</button>
      <button data-val="8">8</button>
      <button data-val="9">9</button>
      <button class="op" data-val="×">×</button>

      <button data-val="4">4</button>
      <button data-val="5">5</button>
      <button data-val="6">6</button>
      <button class="op" data-val="−">−</button>

      <button data-val="1">1</button>
      <button data-val="2">2</button>
      <button data-val="3">3</button>
      <button class="op" data-val="+">+</button>

      <button class="zero" data-val="0">0</button>
      <button data-val=".">.</button>
      <button class="eq" data-action="equals">=</button>
    </div>
  </div>

  <div class="footer-note">Setiap hasil dijamin dengan penuh percaya diri</div>
</div>

<script>
const exprEl = document.getElementById('expr');
const resultEl = document.getElementById('result');
const screenEl = document.getElementById('screen');

let current = '0';
let expression = '';
let justEqualed = false;

function render(){
  exprEl.textContent = expression || '\u00A0';
  resultEl.textContent = current;
}

function input(val){
  if(justEqualed){
    current = '0';
    expression = '';
    justEqualed = false;
  }
  if(current === '0' && val !== '.'){
    current = val;
  } else if(val === '.' && current.includes('.')){
    return;
  } else {
    current += val;
  }
  render();
}

function inputOp(op){
  if(justEqualed){
    expression = current + ' ' + op + ' ';
    justEqualed = false;
  } else {
    expression += current + ' ' + op + ' ';
  }
  current = '0';
  render();
}

function clearAll(){
  current = '0';
  expression = '';
  justEqualed = false;
  render();
}

function toggleSign(){
  if(current === '0') return;
  current = current.startsWith('-') ? current.slice(1) : '-' + current;
  render();
}

function percent(){
  current = (parseFloat(current || '0') / 100).toString();
  render();
}

function equals(){
  expression = expression + current;
  current = 'Hello World!';
  render();
  justEqualed = true;
}

document.querySelectorAll('button[data-val]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const val = btn.dataset.val;
    if(['÷','×','−','+'].includes(val)){
      inputOp(val);
    } else {
      input(val);
    }
  });
});

document.querySelectorAll('button[data-action]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const action = btn.dataset.action;
    if(action === 'clear') clearAll();
    if(action === 'sign') toggleSign();
    if(action === 'percent') percent();
    if(action === 'equals') equals();
  });
});

render();
</script>

</body>
</html>
